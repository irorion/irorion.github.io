    <!-- Stop multiple video tracts playing at once -->
<script>
const players = document.querySelectorAll("video");

players.forEach(p => {
    p.addEventListener("play", () => {
        players.forEach(other => {
            if (other !== p) other.pause();
        });
    });
});
